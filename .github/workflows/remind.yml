name: Nhắc học và báo thư
on:
  schedule:
    - cron: '*/5 * * * *'   # mỗi 5 phút: báo thư mới; nhắc học 1 lần/ngày theo giờ Na chọn
  workflow_dispatch:
    inputs:
      force:
        description: 'Gửi thử ngay (bỏ qua giờ hẹn)'
        type: boolean
        default: true
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: scripts/state.json
          key: remind-state-${{ github.run_id }}
          restore-keys: remind-state-
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node remind.mjs
        working-directory: scripts
        env:
          STUDY_CODE: ${{ secrets.STUDY_CODE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/state.json
          key: remind-state-${{ github.run_id }}
