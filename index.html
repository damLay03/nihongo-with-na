<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo với Na</title>
<meta name="theme-color" content="#FFF4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nihongo Na">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/ts-fsrs@4.7.1/dist/index.umd.js"></script>
<style>
/* Layout: one phone-width column, cards stacked, bottom tab bar. Pink-peach-cream, rounded sticker feel. */
:root{
  --bg:#FFF4EF; --surface:#FFFFFF; --surface2:#FFE8E2; --line:#F2D3CC;
  --ink:#4A2C2E; --muted:#8E6B69; --pink:#FF7FA2; --pink-deep:#D9497A; --peach:#FFB38A; --cream:#FFF9F4;
  --again:#EF6F7A; --hard:#F2A25C; --good:#43B58A; --easy:#5B9BE0; --on-accent:#FFFFFF;
  --shadow:0 3px 0 #F0CFC7;
  --f-ui:'Nunito','M PLUS Rounded 1c',system-ui,sans-serif;
  --f-jp:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#261A1F; --surface:#33242A; --surface2:#432E37; --line:#553B45;
  --ink:#FCEDEA; --muted:#CCA9A8; --pink:#FF8FB0; --pink-deep:#FF9DBD; --peach:#FFB896; --cream:#2E2026;
  --again:#F2848D; --hard:#F5B072; --good:#5CC9A0; --easy:#7AB2F0; --on-accent:#2A1A20; --shadow:0 3px 0 #1C1216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#261A1F; --surface:#33242A; --surface2:#432E37; --line:#553B45;
  --ink:#FCEDEA; --muted:#CCA9A8; --pink:#FF8FB0; --pink-deep:#FF9DBD; --peach:#FFB896; --cream:#2E2026;
  --again:#F2848D; --hard:#F5B072; --good:#5CC9A0; --easy:#7AB2F0; --on-accent:#2A1A20; --shadow:0 3px 0 #1C1216; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.jp{font-family:var(--f-jp)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.6rem;font-weight:900}
h2{font-size:1.2rem;font-weight:900}
h3{font-size:1.02rem;font-weight:800}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:900;background:var(--pink);color:var(--on-accent);box-shadow:0 4px 0 var(--pink-deep);transition:transform .08s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-deep)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{width:42px;height:42px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-size:1.2rem;font-weight:900;flex:none}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--muted);text-decoration:none;font-weight:800;font-size:.78rem}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--pink-deep);background:var(--surface2)}
/* hero sticker */
.hero{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center}
.hero img{width:132px;height:auto;filter:drop-shadow(0 4px 6px rgba(120,60,60,.15))}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;min-width:0}
.bubble:before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
/* lesson list */
.lesson{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.lesson .ic{width:52px;height:52px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-jp);font-weight:800;font-size:1.4rem;color:var(--pink-deep)}
.lesson.locked{opacity:.55}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:5px;border-radius:16px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;padding:9px 10px;border-radius:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--pink-deep);box-shadow:0 2px 0 var(--line)}
/* kana grid */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}.kgrid.k3 .kcell{aspect-ratio:auto;padding:10px 0}
.kcell{aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-jp);font-size:1.7rem;font-weight:700;line-height:1.1;position:relative}
.kcell small{font-family:var(--f-ui);font-size:.72rem;color:var(--muted);font-weight:800}
.kcell.empty{visibility:hidden}
.kcell .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.ksec{margin:18px 0 8px;font-weight:900;color:var(--muted);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
/* vocab */
.word{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.word:last-child{border-bottom:0}
.word .w{font-family:var(--f-jp);font-size:1.25rem;font-weight:700}
.word .m{font-size:.92rem}
.spk{width:40px;height:40px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.spk svg{width:20px;height:20px}
ruby rt{font-size:.5em;color:var(--muted);font-weight:700}
ruby.hide rt{visibility:hidden}
.tip{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;background:var(--cream);border:2px dashed var(--peach);border-radius:16px;padding:10px;font-size:.92rem;white-space:pre-line}
.tip img{width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:12px;background:var(--surface2);font-family:var(--f-jp);font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip small{font-family:var(--f-ui);font-size:.7rem;color:var(--muted);font-weight:700}
.ex{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.ex .j{font-family:var(--f-jp);font-size:1.08rem;font-weight:700;line-height:1.9}
/* review */
.rv{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 160px)}
.flash{flex:1;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:22px}
.flash .big{font-family:var(--f-jp);font-size:4.4rem;font-weight:800;line-height:1.2}
.flash .mid{font-family:var(--f-jp);font-size:2.1rem;font-weight:800;line-height:1.5}
.flash .ans{font-size:1.25rem;font-weight:900;color:var(--pink-deep)}
.flash .sub{color:var(--muted);font-size:.92rem}
.flash .kind{font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--pink);color:transparent}
.hl{color:var(--pink-deep);background:var(--surface2);border-radius:6px;padding:0 3px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border-radius:16px;padding:10px 4px;font-weight:900;color:var(--on-accent);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.grade small{font-weight:700;font-size:.72rem;opacity:.9}
.g1{background:var(--again)}.g2{background:var(--hard)}.g3{background:var(--good)}.g4{background:var(--easy)}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--good);transition:width .3s}
/* toast sticker */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;z-index:40;display:flex;align-items:center;gap:8px;width:min(92vw,440px);background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:8px 12px;box-shadow:0 8px 24px rgba(90,40,50,.18);transition:all .25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast img{width:84px;flex:none}
.toast p{margin:0;font-weight:900}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(40,20,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.trace{position:relative;width:min(100%,300px);aspect-ratio:1;margin:0 auto;background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden;touch-action:none}
.trace svg,.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.trace .grid line{stroke:var(--line);stroke-dasharray:3 3}
/* games */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:18px;background:var(--pink);color:var(--on-accent);font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:.95rem;box-shadow:0 4px 0 var(--pink-deep);transition:transform .2s}
.mcard.open{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.mcard.done{background:var(--surface2);color:var(--good);border:2px solid var(--good);box-shadow:none}
.mcard .jp{font-size:1.5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:800;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--good);color:var(--on-accent);border-color:var(--good)}
.opt.no{background:var(--again);color:var(--on-accent);border-color:var(--again)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input,.field textarea{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.switch:last-child{border-bottom:0}
.tg{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.tg[aria-checked="true"]{background:var(--good)}
.tg[aria-checked="true"]:after{left:25px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}
.bars div{flex:1;background:var(--pink);border-radius:6px 6px 2px 2px;min-height:2px}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:20px}
.conv{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.conv .who{font-family:var(--f-jp);font-weight:800;color:var(--pink-deep);font-size:.9rem;padding-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* full version additions */
.sheet>*{flex-shrink:0}
.kgrid.kj{grid-template-columns:repeat(4,minmax(0,1fr))}.kgrid.kj .kcell{font-size:1.9rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
.tbl th{text-align:left;color:var(--muted);font-size:.78rem;font-weight:900;padding:6px 4px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px dashed var(--line);vertical-align:top;font-family:var(--f-jp);font-weight:700}
.tbl td.vn{font-family:var(--f-ui);font-weight:600}
.tblwrap{overflow-x:auto}
.kinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.kinfo dt{color:var(--muted);font-weight:800}.kinfo dd{margin:0;font-family:var(--f-jp);font-weight:700}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.off i{background:var(--hard)}
.codein{font:inherit;font-size:1.2rem;letter-spacing:.06em;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.seg button[aria-pressed="true"]{border-color:var(--pink);background:var(--surface2);color:var(--pink-deep)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Chuyển màn hình"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"><img alt="" id="toastImg"><p id="toastTxt"></p></div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
